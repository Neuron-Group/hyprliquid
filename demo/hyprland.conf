hl.permission {
    binary = "@hyprland@",
    type = "plugin",
    mode = "allow"
}

hl.monitor {
    output = "",
    mode = "preferred",
    position = "auto",
    scale = "auto"
}

hl.config {
    input = {
        kb_layout = "us"
    },
    general = {
        gaps_in = 5,
        gaps_out = 6,
        border_size = 2,
        layout = "dwindle",
        allow_tearing = false,
        resize_on_border = true,
        col = {
            active_border = "rgba(8bd5cfff)",
            inactive_border = "rgba(6e738d99)"
        }
    },
    decoration = {
        rounding = 18,
        active_opacity = 1.0,
        inactive_opacity = 1.0,
        shadow = {
            enabled = true,
            range = 20,
            render_power = 3,
            color = "rgba(00000055)"
        },
        blur = {
            enabled = true,
            size = 3,
            passes = 1,
            new_optimizations = true
        }
    },
    animations = {
        enabled = true,
        bezier = { "liquid", 0.16, 1, 0.3, 1 },
        animation = {
            { "windows", 1, 5, "liquid" },
            { "windowsOut", 1, 5, "liquid", "popin 80%" },
            { "border", 1, 8, "liquid" },
            { "fade", 1, 5, "liquid" },
            { "workspaces", 1, 5, "liquid", "slide" }
        }
    },
    misc = {
        force_default_wallpaper = 0,
        disable_hyprland_logo = true,
        disable_splash_rendering = true
    },
    xwayland = {
        enabled = false
    },
}

hl.workspace_rule { workspace = "1", persistent = true }
hl.workspace_rule { workspace = "2", persistent = true }
hl.workspace_rule { workspace = "3", persistent = true }
hl.workspace_rule { workspace = "4", persistent = true }
hl.workspace_rule { workspace = "5", persistent = true }

hl.bind("SUPER + Return", hl.dsp.exec_cmd("foot --config @foot-config@"))
hl.bind("SUPER + SHIFT + Return", hl.dsp.exec_cmd("kitty --config @kitty-config@"))
hl.bind("SUPER + SPACE", hl.dsp.exec_cmd("fuzzel --config @fuzzel-config@"))
hl.bind("SUPER + SHIFT + SPACE", hl.dsp.exec_cmd("hyprliquid-dock toggle"))
hl.bind("SUPER + Q", hl.dsp.window.close())
hl.bind("SUPER + M", hl.dsp.exit())
hl.bind("SUPER + SHIFT + V", hl.dsp.window.float({ action = "toggle" }))
hl.bind("CTRL + ALT + V", hl.dsp.window.float({ action = "toggle" }))
hl.bind("SUPER + H", hl.dsp.focus({ direction = "left" }))
hl.bind("SUPER + J", hl.dsp.focus({ direction = "down" }))
hl.bind("SUPER + K", hl.dsp.focus({ direction = "up" }))
hl.bind("SUPER + L", hl.dsp.focus({ direction = "right" }))
hl.bind("SUPER + SHIFT + H", hl.dsp.window.move({ direction = "left" }))
hl.bind("SUPER + SHIFT + J", hl.dsp.window.move({ direction = "down" }))
hl.bind("SUPER + SHIFT + K", hl.dsp.window.move({ direction = "up" }))
hl.bind("SUPER + SHIFT + L", hl.dsp.window.move({ direction = "right" }))
hl.bind("SUPER + ALT + H", hl.dsp.window.move({ x = -50, y = 0 }))
hl.bind("SUPER + ALT + J", hl.dsp.window.move({ x = 0, y = 50 }))
hl.bind("SUPER + ALT + K", hl.dsp.window.move({ x = 0, y = -50 }))
hl.bind("SUPER + ALT + L", hl.dsp.window.move({ x = 50, y = 0 }))
hl.bind("SUPER + CTRL + H", hl.dsp.window.resize({ x = -50, y = 0 }))
hl.bind("SUPER + CTRL + J", hl.dsp.window.resize({ x = 0, y = 50 }))
hl.bind("SUPER + CTRL + K", hl.dsp.window.resize({ x = 0, y = -50 }))
hl.bind("SUPER + CTRL + L", hl.dsp.window.resize({ x = 50, y = 0 }))
hl.bind("SUPER + F", hl.dsp.window.fullscreen())
hl.bind("SUPER + P", hl.dsp.window.pseudo())
hl.bind("SUPER + E", hl.dsp.layout("togglesplit"))
hl.bind("SUPER + TAB", hl.dsp.focus({ workspace = "m+1" }))
hl.bind("SUPER + SHIFT + TAB", hl.dsp.focus({ workspace = "m-1" }))
hl.bind("SUPER + bracketleft", hl.dsp.focus({ workspace = "m-1" }))
hl.bind("SUPER + bracketright", hl.dsp.focus({ workspace = "m+1" }))
hl.bind("SUPER + SHIFT + bracketleft", hl.dsp.window.move({ workspace = "m-1" }))
hl.bind("SUPER + SHIFT + bracketright", hl.dsp.window.move({ workspace = "m+1" }))
hl.bind("SUPER + 1", hl.dsp.focus({ workspace = 1 }))
hl.bind("SUPER + 2", hl.dsp.focus({ workspace = 2 }))
hl.bind("SUPER + 3", hl.dsp.focus({ workspace = 3 }))
hl.bind("SUPER + 4", hl.dsp.focus({ workspace = 4 }))
hl.bind("SUPER + 5", hl.dsp.focus({ workspace = 5 }))
hl.bind("SUPER + SHIFT + 1", hl.dsp.window.move({ workspace = 1 }))
hl.bind("SUPER + SHIFT + 2", hl.dsp.window.move({ workspace = 2 }))
hl.bind("SUPER + SHIFT + 3", hl.dsp.window.move({ workspace = 3 }))
hl.bind("SUPER + SHIFT + 4", hl.dsp.window.move({ workspace = 4 }))
hl.bind("SUPER + SHIFT + 5", hl.dsp.window.move({ workspace = 5 }))

hl.plugin.load("@plugin@")

if hl.plugin.hyprliquid then
    hl.config {
        plugin = {
            hyprliquid = {
                watch_system_color_scheme = true
            }
        }
    };

    hl.window_rule {
        name = "liquid-terminals",
        match = { class = "^(foot|kitty)$" },
        border_size = 0,
        no_shadow = true,
        opacity = "1.0",
        ["hyprliquid:effect"] = "liquid_glass",
        ["hyprliquid:rounding_lua"] = 64,
        ["hyprliquid:tint_color"] = "rgba(10, 88, 205, 0.42)",
    }

    hl.window_rule {
        name = "acrylic-browser",
        match = { class = "^(firefox|zen|chromium)$" },
        ["hyprliquid:effect"] = "acrylic",
        ["hyprliquid:color_scheme"] = "follow_system"
    }

    hl.window_rule {
        name = "mica-editor",
        match = { class = "^(code|codium)$" },
        ["hyprliquid:effect"] = "mica_alt",
        ["hyprliquid:color_scheme"] = "dark"
    }

    hl.layer_rule {
        name = "liquid-wayle-popup",
        match = { namespace = "^wayle-.*$" },
        ["hyprliquid:effect"] = "liquid_glass",
        ["hyprliquid:corner_radius"] = 18,
        ["hyprliquid:glass_thickness"] = 800.0,
        ["hyprliquid:glass_dispersion"] = true,
        ["hyprliquid:brightness"] = 1.05,
        ["hyprliquid:tint_color"] = "rgba(10, 88, 205, 0.18)",
        ["hyprliquid:highlight_style"] = 4,
    }

    hl.layer_rule {
        name = "liquid-wayle-bar",
        match = { namespace = "^wayle-bar-.*$" },
        ["hyprliquid:effect"] = "liquid_glass",
        ["hyprliquid:corner_radius"] = 24,
        ["hyprliquid:glass_thickness"] = 900.0,
        ["hyprliquid:glass_dispersion"] = true,
        ["hyprliquid:brightness"] = 1.05,
        ["hyprliquid:tint_color"] = "rgba(10, 88, 205, 0.24)",
        ["hyprliquid:highlight_style"] = 4,
    }

    hl.layer_rule {
        name = "liquid-launcher",
        match = { namespace = "^hyprliquid-launcher$" },
        blur = false,
        ["hyprliquid:effect"] = "liquid_glass",
        ["hyprliquid:corner_radius"] = 16,
        ["hyprliquid:glass_thickness"] = 700.0,
        ["hyprliquid:glass_dispersion"] = true,
        ["hyprliquid:brightness"] = 1.05,
        ["hyprliquid:tint_color"] = "rgba(10, 88, 205, 0.42)",
        ["hyprliquid:highlight_style"] = 4,
    }

    hl.layer_rule {
        name = "liquid-dock",
        match = { namespace = "^nwg-dock$" },
        blur = true,
        ["hyprliquid:effect"] = "liquid_glass",
        ["hyprliquid:corner_radius"] = 16,
        ["hyprliquid:glass_thickness"] = 700.0,
        ["hyprliquid:glass_dispersion"] = true,
        ["hyprliquid:brightness"] = 1.05,
        ["hyprliquid:tint_color"] = "rgba(10, 88, 205, 0.42)",
        ["hyprliquid:highlight_style"] = 4,
    }

end
hl.on("hyprland.start", function ()
    hl.exec_cmd("swaybg -i @wallpaper@ -m fill")
    hl.exec_cmd("fcitx5 -d --replace")
    hl.exec_cmd("@panel-command@")
    hl.exec_cmd("foot --config @foot-config@ --server")
    hl.exec_cmd("hyprliquid-dock start")
    hl.notification.create {
        text = "hyprliquid loaded and configured",
        timeout = 4000,
        color = "rgba(8bd5cfff)"
    }
end)
